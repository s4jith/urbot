# Interview Bot — Docker Compose
#
# Usage:
#   Development (with local Redis):
#     docker compose --profile dev up --build
#
#   Production (with cloud Redis + MongoDB Atlas):
#     docker compose up --build
#
# Required environment variables — copy .env.example to .env and fill in values.

services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:7860"
    environment:
      APP_ENV: ${APP_ENV:-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-interview_bot}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL_DOMAIN: ${ADMIN_EMAIL_DOMAIN:-}
      TTS_MAX_CONCURRENT: ${TTS_MAX_CONCURRENT:-4}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # allow time for XTTS warmup

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Local Redis (development only) ──────────────────────────────────────────
  # Start with: docker compose --profile dev up
  # In production, set REDIS_URL to your cloud Redis URL and omit this service.
  redis:
    image: redis:7-alpine
    profiles: [dev]
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  uploads_data:
  redis_data:
